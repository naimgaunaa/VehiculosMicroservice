server:
  port: 8083

spring:
  application:
    name: vehiculos-service
  profiles:
    default: local
  web:
    locale: es
    locale-resolver: fixed
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: vehiculos
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: vehiculos

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
